name: Render Short (3D)

# 3D Shorts rendered with Blender (Cycles, CPU) on GitHub's servers.
#
#   * Any push that changes render3d/** renders a quick PREVIEW (540x960, 15 fps).
#   * Put "[final]" in the commit message for the FULL render (1080x1920, 30 fps).
#   * Or run it by hand: Actions -> Render Short (3D) -> Run workflow (once this file is on main).
#
# Download the video from the run page under "Artifacts" (kept 30 days).
on:
  workflow_dispatch:
    inputs:
      short:
        description: "Short to render (render3d/shorts/<name>.py)"
        default: "s002"
      quality:
        description: "preview (fast check) or final (full quality)"
        type: choice
        options: [preview, final]
        default: preview
  push:
    paths:
      - "render3d/**"
      - ".github/workflows/render-short.yml"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  SHORT: ${{ inputs.short || 's002' }}
  QUALITY: ${{ inputs.quality || (contains(github.event.head_commit.message, '[final]') && 'final' || 'preview') }}
  PY: "3.13"

jobs:
  prep:
    name: Voice, sound mix and shot plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY }}
          cache: pip
          cache-dependency-path: render3d/requirements.txt
      - name: Packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r render3d/requirements.txt
          bash render/fetch_assets.sh voices || echo "offline voice unavailable"
      - name: Prep
        id: plan
        run: |
          if [ "$QUALITY" = "final" ]; then N=16; else N=4; fi
          python render3d/render.py prep --short "$SHORT" --quality "$QUALITY" --shards $N --work out/work
          echo "shards=$(python -c "import json;print(json.dumps(list(range($N))))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: |
            out/work/plan.json
            out/work/mix.wav
          retention-days: 3

  shots:
    name: Render shard ${{ matrix.shard }}
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY }}
          cache: pip
          cache-dependency-path: render3d/requirements.txt
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libxi6 libxkbcommon0 libsm6 libxxf86vm1 libxfixes3 \
            libxrender1 libgl1 libegl1
          pip install -r render3d/requirements.txt
          nproc; free -g | head -2
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: out/work
      - name: Render shots
        run: python render3d/render.py shots --shard ${{ matrix.shard }} --work out/work
      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.shard }}
          path: out/work/shot*.mp4
          compression-level: 0
          retention-days: 3

  assemble:
    name: Assemble video
    needs: shots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY }}
      - name: Packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install numpy==2.5.5
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: out/work
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: out/work
      - name: Assemble
        run: |
          NAME="${SHORT}_${QUALITY}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          python render3d/render.py assemble --work out/work --out "out/$NAME.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration,size \
            -of default=nw=1 "out/$NAME.mp4"
          ffmpeg -v error -y -i "out/$NAME.mp4" -vf "fps=1/2.5,scale=270:-1,tile=8x3" -frames:v 1 out/frames.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHORT }}-${{ env.QUALITY }}-video
          path: |
            out/${{ env.NAME }}.mp4
            out/frames.jpg
          compression-level: 0
          retention-days: 30
